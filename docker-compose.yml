services:
  postgres:
    image: postgres:16-alpine
    container_name: amrutam-postgres
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam_user
      POSTGRES_PASSWORD: amrutam_dev_123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam_user -d amrutam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    command: redis-server --requirepass redis_dev_123 --bind 0.0.0.0 --protected-mode yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
